    <style>
      /* Shown until the JS bundle loads; replaced by the app's first render. */
      #app-loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#f0f0ed}

      <style>#app{display:none}html,body{height:auto;overflow:auto}noscript p,noscript ul{margin:0 0 12px}noscript ul{padding-left:20px}</style>
      <main style="max-width:560px;margin:48px auto;padding:0 20px;font-family:-apple-system,BlinkMacSystemFont,sans-serif;line-height:1.6;color:#1a1a1a">
        <h1>Notebook</h1>
        <p>A calm, focused place for your thoughts — markdown notes with tags, pinning, and instant search, synced across every device you own.</p>
        <ul>
          <li><strong>Markdown</strong> — Bold, italic, lists — lightweight formatting that stays out of your way.</li>
          <li><strong>Tags</strong> — Work, ideas, personal. One tap isolates exactly what you need.</li>
          <li><strong>Pins</strong> — Keep your most-referenced notes locked to the top.</li>
          <li><strong>Instant search</strong> — Any note, by title or content, in milliseconds.</li>
          <li><strong>Works offline</strong> — Write without a connection; changes sync when you're back online.</li>
          <li><strong>Private to your account</strong> — Your notes are stored with your account, and access rules keep other users out.</li>
        </ul>
        <p><strong>Notebook needs JavaScript. Please enable it in your browser.</strong></p>
        <p><a href="/datenschutz.html">Datenschutz</a></p>
      </main>
    </noscript>
